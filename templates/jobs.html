<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Populations — FantasiaStats.WIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
:root {
  --bg: #0b0e1a; --surface: #111827; --card: #141d2e; --border: #1e2d47;
  --accent: #00d4ff; --accent2: #7c3aed; --green: #10b981; --yellow: #f59e0b;
  --red: #ef4444; --text: #e2e8f0; --muted: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,26,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 8px 32px; display: flex; align-items: center; flex-wrap: wrap; min-height: 56px; gap: 8px 24px;
}
.nav-logo { font-family: 'Rajdhani',sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; }
.nav-logo span { color: var(--text); }
.nav-back { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
.nav-back:hover { color: var(--text); background: rgba(255,255,255,0.05); }

main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

/* Class filter bar */
.filter-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 28px; flex-wrap: wrap;
}
.filter-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  font-family: 'Share Tech Mono', monospace; font-size: 13px; padding: 6px 14px;
  border-radius: 4px; cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { color: var(--text); border-color: var(--muted); }
.filter-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.08); }
.sort-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  font-family: 'Share Tech Mono', monospace; font-size: 13px; padding: 6px 14px;
  border-radius: 4px; cursor: pointer; transition: all 0.15s;
}
.sort-btn:hover { color: var(--text); border-color: var(--muted); }
.sort-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.08); }
.filter-btn[data-class="Warrior"].active    { color: #ff4444; border-color: #ff4444; background: rgba(255,68,68,0.08); }
.filter-btn[data-class="Magician"].active   { color: #bb44ff; border-color: #bb44ff; background: rgba(187,68,255,0.08); }
.filter-btn[data-class="Archer"].active     { color: #33ff77; border-color: #33ff77; background: rgba(51,255,119,0.08); }
.filter-btn[data-class="Thief"].active      { color: #4477ff; border-color: #4477ff; background: rgba(68,119,255,0.08); }
.filter-btn[data-class="Pirate"].active     { color: #ffaa00; border-color: #ffaa00; background: rgba(255,170,0,0.08); }
.filter-btn[data-class="Beginner"].active   { color: #95a5a6; border-color: #95a5a6; background: rgba(149,165,166,0.08); }

/* Cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
.card-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

/* Two column layout */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* Chart containers */
.chart-wrap { position: relative; height: 360px; }
.chart-wrap-tall { position: relative; height: 480px; }

/* Job breakdown table */
.class-section { margin-bottom: 32px; }
.class-header {
  font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.job-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
}
.job-name { font-size: 14px; color: var(--text); }
.job-count { font-family: 'Share Tech Mono', monospace; font-size: 15px; }
.job-pct { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin-left: 6px; }

.loading { color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 14px; padding: 40px; text-align: center; }

/* Level dist branch charts */
.branch-grid { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 4px; }
.branch-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.branch-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.branch-chart-wrap { position: relative; height: 300px; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">FantasiaStats<span>.win</span></div>
  <a href="/" class="nav-back">← Dashboard</a>
</nav>

<main>
  <div class="filter-bar">
    <span style="font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:4px;">Class:</span>
    <button class="filter-btn active" data-class="All">All</button>
    <button class="filter-btn" data-class="Warrior">Warrior</button>
    <button class="filter-btn" data-class="Magician">Magician</button>
    <button class="filter-btn" data-class="Archer">Archer</button>
    <button class="filter-btn" data-class="Thief">Thief</button>
    <button class="filter-btn" data-class="Pirate">Pirate</button>
    <button class="filter-btn" data-class="Beginner">Beginner</button>
  </div>


  <div class="two-col">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="card-title" style="margin-bottom:0;">Current Job Population by Branch</div>
        <div style="display:flex;gap:6px;">
          <button id="pop-sort-class" onclick="setPopSort(false)" class="sort-btn active" style="font-size:11px;padding:4px 10px;">CLASS ORDER</button>
          <button id="pop-sort-desc" onclick="setPopSort(true)" class="sort-btn" style="font-size:11px;padding:4px 10px;">DESCENDING</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart-job-pop"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Branch Population Trends Over Time</div>
      <div class="chart-wrap"><canvas id="chart-job-trends"></canvas></div>
    </div>
  </div>

  <div id="breakdown-container" class="card">
    <div class="card-title">Job Breakdown by Branch</div>
    <div id="breakdown-content"><div class="loading">Loading...</div></div>
  </div>

  <div class="card">
    <div class="card-title">Level Distribution by Branch</div>
    <div id="level-dist-content"><div class="loading">Loading...</div></div>
  </div>
</main>

<script>
Chart.register(ChartDataLabels);

const CLASS_COLORS = {
  Beginner: '#95a5a6', Warrior: '#ff4444', Magician: '#bb44ff',
  Archer: '#33ff77', Thief: '#4477ff', Pirate: '#ffaa00',
};

// Per-job colors matching class branches from visualize.py
const JOB_COLORS = {
  0:   '#95a5a6',
  100: '#ff4444', 110: '#ff4444', 111: '#ff8800', 112: '#ffcc00',
  120: '#cc44ff', 121: '#8800ff', 122: '#4400cc',
  130: '#ff44aa', 131: '#cc0055', 132: '#880033',
  200: '#bb44ff', 210: '#ff6600', 211: '#ff0000', 212: '#880000',
  220: '#44aaff', 221: '#0066ff', 222: '#0033cc',
  230: '#ffffff', 231: '#cccccc', 232: '#999999',
  300: '#33ff77', 310: '#33ff77', 311: '#00cc44', 312: '#008833',
  320: '#ffff44', 321: '#cccc00', 322: '#888800',
  400: '#4488ff', 410: '#4488ff', 411: '#0044cc', 412: '#002288',
  420: '#ff8844', 421: '#cc4400', 422: '#882200',
  500: '#ffaa00', 510: '#ffdd00', 511: '#ff4400', 512: '#880000',
  520: '#00ffee', 521: '#0088ff', 522: '#cc00ff',
};

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { display: false },
    datalabels: { display: false },
  },
  scales: {
    x: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 12 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
    y: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 12 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
  },
};

let charts = {};
let currentClass = 'All';
let allJobData = null;
let popSortDescending = false;

function setPopSort(descending) {
  popSortDescending = descending;
  document.getElementById('pop-sort-class').classList.toggle('active', !descending);
  document.getElementById('pop-sort-desc').classList.toggle('active', descending);
  if (allJobData) renderPopChart(allJobData, currentClass);
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

// ─── Job Population Bar Chart ─────────────────────────────────────────────────
function renderPopChart(jobData, filterClass) {
  destroyChart('chart-job-pop');

  // Branch definitions matching the backend
  const CLASS_BRANCHES_POP = {
    Warrior:  { Fighter: [110,111,112], Knight: [120,121,122], Spearman: [130,131,132] },
    Magician: { 'Fire/Poison': [210,211,212], 'Ice/Lightning': [220,221,222], Cleric: [230,231,232] },
    Archer:   { Hunter: [310,311,312], Crossbow: [320,321,322] },
    Thief:    { Assassin: [410,411,412], Bandit: [420,421,422] },
    Pirate:   { Brawler: [510,511,512], Gunslinger: [520,521,522] },
    Beginner: { Beginner: [0] },
  };

  // Build a flat lookup of job_id -> job info from jobData
  const jobLookup = {};
  for (const [cls, jobs] of Object.entries(jobData)) {
    for (const j of jobs) jobLookup[j.job_id] = j;
  }

  const CLASS_ORDER = ['Warrior', 'Magician', 'Archer', 'Thief', 'Pirate', 'Beginner'];

  // Determine which classes to include in fixed job-ID order
  const classesToOrder = filterClass === 'All'
    ? CLASS_ORDER.filter(c => c !== 'Beginner')
    : [filterClass];

  // Build branch rows: fixed class order or descending by total
  const branchRows = [];
  for (const cls of classesToOrder) {
    const branches = CLASS_BRANCHES_POP[cls] || {};
    for (const [branchName, jobIds] of Object.entries(branches)) {
      const total = jobIds.reduce((s, id) => s + (jobLookup[id]?.count || 0), 0);
      if (total === 0) continue;
      branchRows.push({ branchName, jobIds, cls, total });
    }
  }
  if (popSortDescending) branchRows.sort((a, b) => b.total - a.total);

  const branchLabels = branchRows.map(b => b.branchName);

  // Collect all unique job_ids across shown branches (excluding base jobs)
  const allJobIds = [...new Set(branchRows.flatMap(b => b.jobIds))];

  // One dataset per job (each job is a segment)
  const datasets = allJobIds.map(job_id => {
    const j = jobLookup[job_id];
    const color = JOB_COLORS[job_id] || '#aaa';
    return {
      label: j?.job_name || String(job_id),
      data: branchRows.map(b => b.jobIds.includes(job_id) ? (j?.count || 0) : 0),
      backgroundColor: color + 'bb',
      hoverBackgroundColor: color + 'ee',
      borderColor: color,
      borderWidth: 1,
    };
  });

  // Total label plugin
  const stackTotalPlugin = {
    id: 'branchTotals',
    afterDatasetsDraw(chart) {
      const { ctx, scales: { x, y } } = chart;
      branchRows.forEach((b, i) => {
        const yPos = y.getPixelForValue(i);
        const xPos = x.getPixelForValue(b.total);
        ctx.save();
        ctx.font = '11px "Share Tech Mono"';
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'left';
        ctx.fillText(b.total.toLocaleString(), xPos + 6, yPos + 4);
        ctx.restore();
      });
    },
  };

  const ctx = document.getElementById('chart-job-pop');
  if (!ctx) return;

  charts['chart-job-pop'] = new Chart(ctx, {
    type: 'bar',
    plugins: [stackTotalPlugin, ChartDataLabels],
    data: { labels: branchLabels, datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index',
          intersect: true,
          callbacks: {
            title: items => items.length ? items[0].label : '',
            label: ctx => ctx.raw > 0 ? ` ${ctx.dataset.label}: ${ctx.raw.toLocaleString()}` : null,
          },
        },
        datalabels: {
          display: ctx => ctx.dataset.data[ctx.dataIndex] > 0,
          anchor: 'center', align: 'center',
          color: '#0b0e1a',
          font: { family: 'Share Tech Mono', size: 10, weight: 'bold' },
          formatter: val => val > 20 ? val.toLocaleString() : '',
        },
      },
      scales: {
        x: {
          stacked: true, grace: '15%',
          ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 12 } },
          grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' },
        },
        y: {
          stacked: true,
          ticks: { color: '#e2e8f0', font: { family: 'Barlow', size: 13, weight: '500' } },
          grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' },
        },
      },
    },
  });
}

// ─── Trends Line Chart ────────────────────────────────────────────────────────
async function renderTrendsChart(filterClass) {
  destroyChart('chart-job-trends');
  const param = filterClass !== 'All' ? `?class=${encodeURIComponent(filterClass)}` : '';
  const res = await fetch(`/api/jobs/trends${param}`);
  if (!res.ok) return;
  const data = await res.json();

  // Only show jobs that have any non-zero data, excluding base class jobs
  const activeSeries = data.series.filter(s => s.data.some(v => v > 0) && (s.job_id === 0 || s.job_id % 100 !== 0));

  const ctx = document.getElementById('chart-job-trends');
  if (!ctx) return;

  charts['chart-job-trends'] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.labels,
      datasets: activeSeries.map(s => {
        const color = JOB_COLORS[s.job_id] || CLASS_COLORS[s.class] || '#aaa';
        return {
          label: s.job_name,
          data: s.data,
          borderColor: color,
          backgroundColor: color + '22',
          borderWidth: 2,
          pointRadius: data.labels.length > 30 ? 0 : 3,
          tension: 0.3,
        };
      }),
    },
    options: {
      ...chartDefaults,
      plugins: {
        ...chartDefaults.plugins,
        legend: {
          display: true,
          position: 'bottom',
          labels: { color: '#64748b', font: { family: 'Barlow', size: 12 }, boxWidth: 10, padding: 10 },
        },
        tooltip: { mode: 'index', intersect: false },
        datalabels: { display: false },
      },
    },
  });
}

// ─── Breakdown Table ──────────────────────────────────────────────────────────
function renderBreakdown(jobData, filterClass) {
  const container = document.getElementById('breakdown-content');
  const totalAll = Object.values(jobData).flat().reduce((s, j) => s + j.count, 0);

  const classesToShow = filterClass === 'All'
    ? Object.keys(jobData)
    : [filterClass];

  container.innerHTML = classesToShow.map(cls => {
    const jobs = jobData[cls].filter(j => j.count > 0).sort((a, b) => b.count - a.count);
    if (!jobs.length) return '';
    const color = CLASS_COLORS[cls] || '#aaa';
    const clsTotal = jobs.reduce((s, j) => s + j.count, 0);
    return `
      <div class="class-section">
        <div class="class-header" style="color:${color}">
          ${cls} <span style="color:var(--muted);font-size:14px;font-weight:400">${clsTotal.toLocaleString()} players (${((clsTotal/totalAll)*100).toFixed(1)}%)</span>
        </div>
        <div class="job-grid">
          ${jobs.map(j => `
            <div class="job-card">
              <span class="job-name">${j.job_name}</span>
              <span>
                <span class="job-count" style="color:${JOB_COLORS[j.job_id] || color}">${j.count.toLocaleString()}</span>
                <span class="job-pct">${((j.count/totalAll)*100).toFixed(1)}%</span>
              </span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ─── Level Distribution by Branch ────────────────────────────────────────────
async function renderLevelDist(filterClass) {
  const container = document.getElementById('level-dist-content');
  container.innerHTML = '<div class="loading">Loading...</div>';

  const param = filterClass !== 'All' ? `?class=${encodeURIComponent(filterClass)}` : '';
  const res = await fetch(`/api/jobs/level_distribution${param}`);
  if (!res.ok) { container.innerHTML = '<div class="loading">Failed to load</div>'; return; }
  const branches = await res.json();

  if (!branches.length) { container.innerHTML = '<div class="loading">No data</div>'; return; }

  // Group by class for headers when showing All
  const grouped = {};
  for (const b of branches) {
    if (!grouped[b.class]) grouped[b.class] = [];
    grouped[b.class].push(b);
  }

  // Destroy old branch charts
  Object.keys(charts).filter(k => k.startsWith('branch-')).forEach(k => {
    charts[k].destroy(); delete charts[k];
  });

  const TIER_JOB_IDS = {
    '1st Job': [100,200,300,400,500],
    '2nd Job': [110,120,130,210,220,230,310,320,410,420,510,520],
    '3rd Job': [111,121,131,211,221,231,311,321,411,421,511,521],
    '4th Job': [112,122,132,212,222,232,312,322,412,422,512,522],
  };

  function branchTierStats(branch) {
    // Sum all bucket counts per job to get total per job_id
    const jobTotals = {};
    for (const j of branch.jobs) {
      jobTotals[j.job_id] = Object.values(j.buckets).reduce((s, v) => s + v, 0);
    }
    const total = Object.values(jobTotals).reduce((s, v) => s + v, 0);
    const get = tier => branch.jobs
      .filter(j => TIER_JOB_IDS[tier]?.includes(j.job_id))
      .reduce((s, j) => s + (jobTotals[j.job_id] || 0), 0);
    return { total, t1: get('1st Job'), t2: get('2nd Job'), t3: get('3rd Job'), t4: get('4th Job') };
  }

  function branchStatHTML(stats) {
    const items = [
      { label: 'Total', value: stats.total },
      { label: '1st', value: stats.t1 },
      { label: '2nd', value: stats.t2 },
      { label: '3rd', value: stats.t3 },
      { label: '4th', value: stats.t4 },
    ].filter(x => x.value > 0);
    return `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;">
      ${items.map(x => `
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 14px;text-align:center;min-width:60px;">
          <div style="font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--accent);line-height:1;">${x.value.toLocaleString()}</div>
          <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;">${x.label}</div>
        </div>`).join('')}
    </div>`;
  }

  let html = '';
  for (const [cls, clsBranches] of Object.entries(grouped)) {
    if (filterClass === 'All') {
      const color = CLASS_COLORS[cls] || '#aaa';
      html += `<div style="margin-bottom:8px;margin-top:16px;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:${color};letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:6px">${cls}</div>`;
    }
    html += '<div class="branch-grid">';
    for (const branch of clsBranches) {
      const id = `branch-${branch.class}-${branch.jobs[0].job_id}`;
      const stats = branchTierStats(branch);
      html += `<div class="branch-card">
        <div class="branch-title">${branch.branch_name}</div>
        ${branchStatHTML(stats)}
        <div class="branch-chart-wrap"><canvas id="${id}"></canvas></div>
      </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;

  // Render each branch chart
  for (const branch of branches) {
    const id = `branch-${branch.class}-${branch.jobs[0].job_id}`;
    const ctx = document.getElementById(id);
    if (!ctx) continue;

    charts[id] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: branch.labels,
        datasets: branch.jobs.map(j => ({
          label: j.job_name,
          data: branch.labels.map(lbl => j.buckets[lbl] || 0),
          backgroundColor: (JOB_COLORS[j.job_id] || '#aaa') + '99',
          borderColor: JOB_COLORS[j.job_id] || '#aaa',
          borderWidth: 1,
          borderRadius: 2,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: branch.jobs.length > 1,
            position: 'bottom',
            labels: { color: '#64748b', font: { family: 'Barlow', size: 13 }, boxWidth: 10, padding: 10 },
          },
          datalabels: { display: false },
          tooltip: { mode: 'index', intersect: false },
        },
        scales: {
          x: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 12 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
          y: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 12 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
        },
      },
    });
  }
}
async function loadAll() {
  const res = await fetch('/api/jobs');
  if (!res.ok) return;
  const payload = await res.json();
  allJobData = payload.classes;

  renderPopChart(allJobData, currentClass);
  renderBreakdown(allJobData, currentClass);
  await Promise.all([
    renderTrendsChart(currentClass),
    renderLevelDist(currentClass),
  ]);
}

// ─── Filter buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.filter-btn[data-class]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentClass = btn.dataset.class;
    renderPopChart(allJobData, currentClass);
    renderBreakdown(allJobData, currentClass);
    await Promise.all([
      renderTrendsChart(currentClass),
      renderLevelDist(currentClass),
    ]);
  });
});

// ─── Read class from URL param ────────────────────────────────────────────────
const urlClass = new URLSearchParams(window.location.search).get('class');
if (urlClass) {
  currentClass = urlClass;
  const btn = document.querySelector(`.filter-btn[data-class="${urlClass}"]`);
  if (btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
}

setPopSort(false);
loadAll();
</script>
</body>
</html>
