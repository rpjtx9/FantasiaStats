<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player — FantasiaStats.WIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0b0e1a; --surface: #111827; --card: #141d2e; --border: #1e2d47;
  --accent: #00d4ff; --accent2: #7c3aed; --green: #10b981; --yellow: #f59e0b;
  --red: #ef4444; --text: #e2e8f0; --muted: #64748b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
}
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,14,26,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 8px 32px; display: flex; align-items: center; flex-wrap: wrap; min-height: 56px; gap: 8px 24px;
}
.nav-logo { font-family: 'Rajdhani',sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; }
.nav-logo span { color: var(--text); }
.nav-back { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
.nav-back:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-hamburger { display: none; margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; flex-direction: column; gap: 4px; }
.nav-hamburger span { display: block; width: 18px; height: 2px; background: var(--muted); border-radius: 2px; }
.nav-mobile-menu { display: none; width: 100%; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; flex-direction: column; gap: 8px; }
@media (max-width: 768px) { .nav-hamburger { display: flex !important; } .nav-controls { display: none !important; } }
.nav-controls { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.preset-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 5px 9px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
.preset-btn:hover, .preset-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,212,255,0.08); }
.date-sep { color: var(--muted); font-size: 13px; padding: 0 2px; }
.date-input { background: var(--card); border: 1px solid var(--border); color: var(--text); font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 5px 8px; border-radius: 4px; cursor: pointer; outline: none; transition: border-color 0.15s; color-scheme: dark; }
.date-input:focus { border-color: var(--accent); }
main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

/* Search */
.search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.search-input { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 16px; padding: 10px 14px; border-radius: 6px; outline: none; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.search-btn { background: var(--accent); color: var(--bg); border: none; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: opacity 0.15s; }
.search-btn:hover { opacity: 0.85; }
.search-results { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: none; margin-bottom: 16px; }
.search-result-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; transition: background 0.1s; border-bottom: 1px solid rgba(255,255,255,0.03); }
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: rgba(0,212,255,0.05); }

/* Scorecard */
.scorecard-header { display: flex; align-items: center; gap: 16px; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; }
.scorecard-name { font-family: 'Rajdhani', sans-serif; font-size: 38px; font-weight: 700; color: var(--text); }
.scorecard-job  { font-size: 16px; color: var(--muted); margin-top: 4px; }
.scorecard-stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 900px) { .scorecard-stats { grid-template-columns: repeat(4, 1fr); } }
.stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; text-align: center; }
.stat-value { font-family: 'Rajdhani', sans-serif; font-size: 30px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-label { font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.stat-block.green .stat-value { color: var(--green); }
.stat-block.blue  .stat-value { color: var(--accent); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid-3, .grid-5 { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.3; }
.card-title { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
.chart-wrap { position: relative; width: 100%; }
.chart-wrap canvas { display: block; }
.loading { text-align: center; padding: 60px; color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 14px; }
.loading::after { content: ''; animation: dots 1.2s steps(3,end) infinite; }
@keyframes dots { 0%,20%{content:'.'} 40%,60%{content:'..'} 80%,100%{content:'...'} }
@keyframes maxed-pulse {
  0%, 100% { box-shadow: 0 0 6px #fbbf24, 0 0 12px rgba(251,191,36,0.4); }
  50%      { box-shadow: 0 0 10px #fde047, 0 0 22px rgba(253,224,71,0.7); }
}
@keyframes maxed-text-glow {
  0%, 100% { text-shadow: 0 0 4px rgba(251,191,36,0.4); }
  50%      { text-shadow: 0 0 8px rgba(253,224,71,0.8); }
}
.maxed-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  background: linear-gradient(90deg, rgba(251,191,36,0.12), rgba(253,224,71,0.18), rgba(251,191,36,0.12));
  border: 1px solid rgba(251,191,36,0.5);
}
.maxed-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #fde047;
  animation: maxed-pulse 1.8s ease-in-out infinite;
  flex-shrink: 0;
}
.maxed-label {
  font-size: 11px; color: #fde047;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
  animation: maxed-text-glow 1.8s ease-in-out infinite;
}
.empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 40px; }
.class-dot { border-radius: 50%; flex-shrink: 0; }

/* Deleted players modal */
.modal-backdrop {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  width: 100%; max-width: 680px; max-height: 80vh; display: flex; flex-direction: column;
  position: relative; overflow: hidden;
}
.modal::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent); opacity: 0.5;
}
.modal-header {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.modal-title { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: color 0.15s; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-sub { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 4px; }
.del-sort-btn { background:none;border:1px solid rgba(255,255,255,0.1);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.06em;padding:3px 10px;border-radius:3px;cursor:pointer;transition:all 0.15s; }
.del-sort-btn:hover { color:var(--text);border-color:rgba(255,255,255,0.25); }
.del-sort-btn.active { color:var(--red);border-color:var(--red);background:rgba(239,68,68,0.1); }
.modal-body { overflow-y: auto; flex: 1; }
.deleted-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer;
  transition: background 0.1s;
}
.deleted-row:last-child { border-bottom: none; }
.deleted-row:hover { background: rgba(255,255,255,0.04); }
.deleted-name { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deleted-meta { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
.deleted-badge {
  font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; padding: 2px 7px; border-radius: 3px; flex-shrink: 0;
}
</style>
</head>
<body>
<nav>
  <a href="/" style="text-decoration:none;"><div class="nav-logo">FantasiaStats<span>.win</span></div></a>
  <a href="/" class="nav-back">← Dashboard</a>
  <div class="nav-controls" id="nav-controls" style="display:none;">
    <button class="preset-btn active" data-hours="87600">All</button>
    <button class="preset-btn" data-hours="168">7d</button>
    <button class="preset-btn" data-hours="720">30d</button>
    <span class="date-sep">|</span>
    <input type="date" id="date-start" class="date-input">
    <span class="date-sep">→</span>
    <input type="date" id="date-end" class="date-input">
  </div>
  <button class="nav-hamburger" id="nav-hamburger" style="display:none;"><span></span><span></span><span></span></button>
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
      <button class="preset-btn mobile-preset active" data-hours="87600">All</button>
      <button class="preset-btn mobile-preset" data-hours="168">7d</button>
      <button class="preset-btn mobile-preset" data-hours="720">30d</button>
      <input type="date" id="date-start-mobile" class="date-input">
      <span class="date-sep">→</span>
      <input type="date" id="date-end-mobile" class="date-input">
    </div>
  </div>
</nav>
<main>
  <div class="search-bar">
    <input type="text" id="player-search-input" class="search-input" placeholder="Search player name..." autocomplete="off">
    <button class="search-btn" id="player-search-btn">Search</button>
  </div>
  <div class="search-results" id="search-results-dropdown"></div>
  <div style="margin-bottom:20px;">
    <button id="deleted-players-btn" style="background:none;border:none;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.06em;cursor:pointer;padding:0;display:flex;align-items:center;gap:6px;transition:color 0.15s;" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--muted)'">
      <div style="width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;"></div>
      VIEW PLAYERS REMOVED FROM RANKINGS
    </button>
  </div>

  <!-- Deleted players modal -->
  <div class="modal-backdrop" id="deleted-modal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" style="color:var(--red);">Players Removed from Rankings</div>
          <div class="modal-sub" id="deleted-modal-sub">Players absent from the current rankings</div>
        </div>
        <button class="modal-close" id="deleted-modal-close">✕</button>
      </div>
      <div style="display:flex;gap:6px;padding:10px 16px 6px;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;">
        <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);align-self:center;margin-right:4px;">SORT:</span>
        <button class="del-sort-btn active" data-sort="level" onclick="setDeletedSort('level')">LEVEL</button>
        <button class="del-sort-btn" data-sort="name" onclick="setDeletedSort('name')">NAME</button>
        <button class="del-sort-btn" data-sort="last_seen" onclick="setDeletedSort('last_seen')">LAST SEEN</button>
        <button class="del-sort-btn" data-sort="class" onclick="setDeletedSort('class')">CLASS</button>
      </div>
      <div class="modal-body" id="deleted-modal-body">
        <div class="loading" style="padding:40px;">Loading</div>
      </div>
    </div>
  </div>

  <div id="scorecard-container"></div>
</main>

<script>
const CLASS_COLORS = {
  Beginner: '#95a5a6', Warrior: '#ff4444', Magician: '#bb44ff',
  Archer: '#33ff77', Thief: '#4488ff', Pirate: '#ffaa00',
};

const charts = {};

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: { legend: { display: false } },
  scales: {
    x: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 13 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
    y: { ticks: { color: '#64748b', font: { family: 'Share Tech Mono', size: 13 } }, grid: { color: 'rgba(255,255,255,0.04)' }, border: { color: '#1e2d47' } },
  },
};

function makeChart(id, type, data, options={}) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, { type, data, options: { ...chartDefaults, ...options } });
}

function fmtExp(n) {
  if (n >= 1_000_000_000) return (n/1e9).toFixed(2)+'B';
  if (n >= 1_000_000) return (n/1e6).toFixed(2)+'M';
  if (n >= 1_000) return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
}

let currentPlayer = '';
let currentHours  = null;
let currentStart  = null;
let currentEnd    = null;

function buildParams() {
  const p = new URLSearchParams();
  if (currentStart && currentEnd) {
    p.set('start', currentStart);
    p.set('end', currentEnd);
  } else if (currentHours) {
    p.set('hours', currentHours);
  }
  return p.toString() ? '?' + p.toString() : '';
}

async function initDatePickers(firstSeen) {
  const res = await fetch('/api/snapshot_range');
  if (!res.ok) return;
  const range = await res.json();
  const startEl = document.getElementById('date-start');
  const endEl   = document.getElementById('date-end');
  // min is player's first seen date, not global min
  const playerMin = firstSeen.substring(0, 10).replace(/_/g, '-').replace(' ', '-');
  startEl.min = range.min;
  startEl.max = range.max;
  endEl.min   = range.min;
  endEl.max   = range.max;
  endEl.value = range.max;

  function onDateChange() {
    const s = startEl.value;
    const e = endEl.value;
    if (s && e && s <= e) {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      currentHours = null;
      currentStart = s;
      currentEnd   = e;
      loadPlayer(currentPlayer);
    }
  }
  startEl.addEventListener('change', onDateChange);
  endEl.addEventListener('change', onDateChange);
}

async function loadPlayer(name) {
  currentPlayer = name;
  const container = document.getElementById('scorecard-container');
  container.innerHTML = '<div class="loading">Loading</div>';

  // Update URL without reload so it's shareable/bookmarkable
  history.replaceState(null, '', `/player/${encodeURIComponent(name)}`);
  document.title = `${name} — Fantasia Rankings`;

  const res = await fetch(`/api/player/${encodeURIComponent(name)}${buildParams()}`);
  const d = await res.json();

  if (!res.ok) {
    container.innerHTML = `<div class="card"><div class="empty-state">${d.error}</div></div>`;
    return;
  }

  // Show nav controls and init date pickers on first load
  const navControls = document.getElementById('nav-controls');
  navControls.style.display = 'flex';
  document.getElementById('nav-hamburger').style.display = '';
  if (!document.getElementById('date-start').dataset.initialized) {
    document.getElementById('date-start').dataset.initialized = '1';
    initDatePickers(d.first_seen);
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const h = parseInt(btn.dataset.hours);
        currentHours = h || null;
        currentStart = null;
        currentEnd   = null;
        document.getElementById('date-start').value = '';
        document.getElementById('date-end').value   = '';
        loadPlayer(currentPlayer);
      });
    });
  }

  const pts = d.data_points;
  const classColor = CLASS_COLORS[d.class] || '#aaa';

  container.innerHTML = `
    <div class="scorecard-header">
      <img src="/icons/${(d.class||'beginner').toLowerCase()}.png"
           style="width:52px;height:52px;object-fit:contain;flex-shrink:0;"
           onerror="this.style.display='none'">
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="scorecard-name">${d.name}</div>
          ${(() => {
            if (d.level >= 200) {
              return `<div class="maxed-pill" title="Reached maximum level">
                <div class="maxed-dot"></div>
                <span class="maxed-label">Max Level</span>
              </div>`;
            }
            const isActive = d.last_active && (() => {
              const t = d.last_active.replace('_',' ').replace(/-(\d{2})-(\d{2})$/, ':$1:$2');
              return (new Date() - new Date(t)) < 30*24*60*60*1000;
            })();
            let color, label, tooltip;
            if (d.is_deleted) {
              color = '#ef4444'; label = 'Deleted';
              tooltip = 'No longer appears in rankings';
            } else if (!d.last_active) {
              color = '#64748b'; label = 'Inactive';
              tooltip = 'Never seen active';
            } else {
              const t = d.last_active.replace('_',' ').replace(/-(\d{2})-(\d{2})$/, ':$1:$2');
              const daysAgo = Math.floor((new Date() - new Date(t)) / (1000*60*60*24));
              if (isActive) {
                color = '#22c55e'; label = 'Active';
                tooltip = daysAgo === 0 ? 'Active today' : `Last active ${daysAgo}d ago`;
              } else {
                color = '#64748b'; label = 'Inactive';
                tooltip = `Last active ${daysAgo}d ago`;
              }
            }
            return `<div style="display:flex;align-items:center;gap:5px;" title="${tooltip}">
              <div style="width:8px;height:8px;border-radius:50%;background:${color};${isActive ? 'box-shadow:0 0 6px '+color+';' : ''}flex-shrink:0;"></div>
              <span style="font-size:11px;color:${color};font-family:'Share Tech Mono',monospace;letter-spacing:.06em;text-transform:uppercase;">${label}</span>
            </div>`;
          })()}
        </div>
        <div class="scorecard-job">${d.job_name} &nbsp;·&nbsp; Rank #${d.rank}</div>
      </div>
    </div>

    <div class="scorecard-stats">
      <div class="stat-block blue"><div class="stat-value">${d.level}</div><div class="stat-label">Level</div></div>
      <div class="stat-block green"><div class="stat-value">${d.levels_gained}</div><div class="stat-label">Levels Gained</div></div>
      <div class="stat-block"><div class="stat-value">${fmtExp(d.total_exp_gained)}</div><div class="stat-label">Total Exp</div></div>
      <div class="stat-block"><div class="stat-value">${fmtExp(d.avg_exp_per_day)}</div><div class="stat-label">Exp / Day</div></div>
      <div class="stat-block"><div class="stat-value">${d.fame}</div><div class="stat-label">Fame</div></div>
      <div class="stat-block"><div class="stat-value">${d.quests}</div><div class="stat-label">Quests</div></div>
      <div class="stat-block"><div class="stat-value">${d.cards}</div><div class="stat-label">Cards</div></div>
      <div class="stat-block"><div class="stat-value">${d.days_tracked}d</div><div class="stat-label">Tracked</div></div>
    </div>

    <div class="grid-5">
      <div class="card">
        <div class="card-title">Level Progression</div>
        <div class="chart-wrap" style="height:220px"><canvas id="sc-level"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Exp Gained Per Snapshot</div>
        <div class="chart-wrap" style="height:220px"><canvas id="sc-exp"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Rank Progression</div>
        <div class="chart-wrap" style="height:220px"><canvas id="sc-rank"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Quest Progression</div>
        <div class="chart-wrap" style="height:220px"><canvas id="sc-quests"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Card Progression</div>
        <div class="chart-wrap" style="height:220px"><canvas id="sc-cards"></canvas></div>
      </div>
    </div>
  `;

  const labels = pts.map(p => p.label);

  makeChart('sc-level', 'line', {
    labels,

  makeChart('sc-exp', 'bar', {
    labels,
    datasets: [{ data: pts.map(p => p.exp_gained), backgroundColor: 'rgba(16,185,129,0.6)', borderColor: '#10b981', borderWidth: 1, borderRadius: 2 }],
  });

  makeChart('sc-rank', 'line', {
    labels,
    datasets: [{ data: pts.map(p => p.rank), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.1)', fill: true, tension: 0.3, pointRadius: 2 }],
  }, {
    plugins: { legend: { display: false } },

}

// ── Search ────────────────────────────────────────────────────────────────────
let searchTimer;
const searchInput   = document.getElementById('player-search-input');
const searchDropdown = document.getElementById('search-results-dropdown');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchDropdown.style.display = 'none'; return; }
  searchTimer = setTimeout(async () => {
    const res = await fetch(`/api/players/search?q=${encodeURIComponent(q)}`);
    const results = await res.json();
    if (!results.length) { searchDropdown.style.display = 'none'; return; }
    searchDropdown.style.display = 'block';
    searchDropdown.innerHTML = results.map(r => `
      <div class="search-result-item" data-name="${r.name}">
        <div class="class-dot" style="width:10px;height:10px;background:${CLASS_COLORS['Beginner']}"></div>
        <div>
          <div style="font-size:16px;font-weight:600">${r.name}</div>
          <div style="font-size:14px;color:var(--muted)">Lv.${r.level} ${r.job_name}</div>
        </div>
      </div>
    `).join('');
    searchDropdown.querySelectorAll('.search-result-item').forEach(el => {
      el.addEventListener('click', () => {
        searchInput.value = el.dataset.name;
        searchDropdown.style.display = 'none';
        loadPlayer(el.dataset.name);
      });
    });
  }, 200);
});

document.getElementById('player-search-btn').addEventListener('click', () => {
  const name = searchInput.value.trim();
  if (name) { searchDropdown.style.display = 'none'; loadPlayer(name); }
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { searchDropdown.style.display = 'none'; loadPlayer(searchInput.value.trim()); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#player-search-input') && !e.target.closest('#search-results-dropdown'))
    searchDropdown.style.display = 'none';
});

// ── Auto-load from URL ────────────────────────────────────────────────────────
const urlName = decodeURIComponent(window.location.pathname.replace('/player/', '').replace('/player', ''));
if (urlName) {
  searchInput.value = urlName;
  loadPlayer(urlName);
}

// ── Deleted / Banned Players Modal ───────────────────────────────────────────
const CLASS_COLORS_MAP = {
  Beginner: '#95a5a6', Warrior: '#ff4444', Magician: '#bb44ff',
  Archer: '#33ff77', Thief: '#4488ff', Pirate: '#ffaa00',
};

let deletedLoaded = false;
let deletedPlayers = [];
let deletedSort = 'level';

function fmtTs(ts) {
  if (!ts) return '—';
  const [d] = ts.split('_');
  return d;
}

function fmtExpShort(n) {
  if (n >= 1_000_000) return (n/1e6).toFixed(1)+'M';
  if (n >= 1_000) return (n/1e3).toFixed(0)+'K';
  return n.toLocaleString();
}

function setDeletedSort(key) {
  deletedSort = key;
  document.querySelectorAll('.del-sort-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sort === key));
  renderDeletedList();
}

function renderDeletedList() {
  const sorted = [...deletedPlayers].sort((a, b) => {
    if (deletedSort === 'level') return b.level - a.level;
    if (deletedSort === 'name') return a.name.localeCompare(b.name);
    if (deletedSort === 'last_seen') return (b.last_seen || '').localeCompare(a.last_seen || '');
    if (deletedSort === 'class') return (a.class || '').localeCompare(b.class || '');
    return 0;
  });
  const body = document.getElementById('deleted-modal-body');
  body.innerHTML = sorted.map(p => {
    const color = CLASS_COLORS_MAP[p.class] || '#aaa';
    const lastSeenDate = fmtTs(p.last_seen);
    const hasActivity = p.total_exp > 0;
    const badgeColor = hasActivity ? 'rgba(239,68,68,0.15)' : 'rgba(100,116,139,0.15)';
    const badgeText  = hasActivity ? 'WAS ACTIVE' : 'NO ACTIVITY';
    const badgeBorder = hasActivity ? 'rgba(239,68,68,0.4)' : 'rgba(100,116,139,0.3)';
    const badgeFg = hasActivity ? 'var(--red)' : 'var(--muted)';
    return '<div class="deleted-row" onclick="closeDeletedModal(); loadPlayer(\'' + p.name.replace(/'/g, "\'") + '\')">'
      + '<div style="width:9px;height:9px;border-radius:50%;background:' + color + ';flex-shrink:0;"></div>'
      + '<div class="deleted-name">' + p.name + '</div>'
      + '<div class="deleted-meta">Lv.' + p.level + ' ' + p.job_name + '</div>'
      + '<div class="deleted-meta" style="min-width:70px;text-align:right;">last seen ' + lastSeenDate + '</div>'
      + '<div class="deleted-meta" style="min-width:60px;text-align:right;">' + (hasActivity ? '+' + fmtExpShort(p.total_exp) : '—') + '</div>'
      + '<div class="deleted-badge" style="background:' + badgeColor + ';border:1px solid ' + badgeBorder + ';color:' + badgeFg + ';">' + badgeText + '</div>'
      + '</div>';
  }).join('');
}

async function openDeletedModal() {
  document.getElementById('deleted-modal').classList.add('open');
  if (deletedLoaded) return;
  deletedLoaded = true;

  const res = await fetch('/api/players/deleted');
  deletedPlayers = await res.json();

  document.getElementById('deleted-modal-sub').textContent =
    deletedPlayers.length + ' players absent from current rankings — click to view profile';

  const body = document.getElementById('deleted-modal-body');
  if (!deletedPlayers.length) {
    body.innerHTML = '<div class="empty-state">No removed players found.</div>';
    return;
  }
  renderDeletedList();
}

function closeDeletedModal() {
  document.getElementById('deleted-modal').classList.remove('open');
}

document.getElementById('deleted-players-btn').addEventListener('click', openDeletedModal);
document.getElementById('deleted-modal-close').addEventListener('click', closeDeletedModal);
document.getElementById('deleted-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDeletedModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDeletedModal();
});
</script>
